# ── nginx reverse proxy pro Streamlit ───────────────────────────
# Streamlit komunikuje přes WebSocket (/_stcore/stream), proto je nutné
# přeposílat Upgrade/Connection hlavičky — jinak appka "věčně načítá".
#
# Aktivace:  docker compose --profile proxy up -d --build

server {
    listen 80;
    server_name _;          # nahraď svojí doménou, např. dashboard.firma.cz

    # Velké uploady/odpovědi (parquet apod.)
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streamlit drží dlouhá spojení
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }
}

